name: CI Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  verify:
    name: Full Verification Gate
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.x]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Architecture Boundary Verification (Dependency Cruiser)
        run: npm run check:arch

      - name: Code Duplication Check (jscpd < 3%)
        run: npm run check:dups

      - name: Static Type Check
        run: npm run typecheck

      - name: Code Quality & ESLint
        run: npm run lint

      - name: WCAG 2.2 Color Contrast Audit
        run: npm run check-contrast

      - name: Traceability Matrix Verification
        run: npm run check:traceability

      - name: Unit & Property Tests with Coverage
        run: npm run test:coverage

      - name: Build Next.js Production Bundle
        run: npm run build

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run End-to-End & Axe A11y Tests
        run: npm run test:e2e

      - name: Run Lighthouse CI Budgets
        run: npx -y @lhci/cli@0.14.x autorun

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
